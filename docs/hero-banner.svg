    <circle cx="34" cy="106" r="3.8" fill="#34D399"/>
    <text x="46" y="110" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AI STAFF &amp; GITHUB SKILLS</text>
    <text x="46" y="126" fill="#E6C992" font-family="system-ui, -apple-system, sans-serif" font-size="11">Claude · Codex · Antigravity · OpenCode · MCP</text>

    <!-- Row 3 -->
    <rect x="18" y="142" width="312" height="44" rx="10" fill="#1A1C26" stroke="#FFFFFF" stroke-opacity="0.06"/>
    <circle cx="34" cy="158" r="3.8" fill="#60A5FA"/>
    <text x="46" y="162" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="0.5">AUTOMATIONS &amp; OFFICES</text>
    <text x="46" y="178" fill="#9BA3B5" font-family="system-ui, -apple-system, sans-serif" font-size="11">Schedules · Runs · Ego Lite · Local Mac · SSH</text>
  </g>

  <!-- Bottom Meta Bar -->
  <g transform="translate(64, 342)">
    <rect x="0" y="0" width="124" height="24" rx="6" fill="#161820" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="62" y="15.5" text-anchor="middle" fill="#D5DBE8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">0 NPM DEPS</text>

    <rect x="134" y="0" width="150" height="24" rx="6" fill="#161820" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="209" y="15.5" text-anchor="middle" fill="#D5DBE8" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">9+ AI TOOLS · MCP</text>

    <rect x="294" y="0" width="166" height="24" rx="6" fill="#161820" stroke="#FFFFFF" stroke-opacity="0.1"/>
    <text x="377" y="15.5" text-anchor="middle" fill="#E6C992" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">21 K-HERITAGE CREW</text>

    <rect x="470" y="0" width="130" height="24" rx="6" fill="#161820" stroke="#34D399" stroke-opacity="0.32"/>
    <text x="535" y="15.5" text-anchor="middle" fill="#6EE7B7" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" font-weight="600">57 / 57 TESTS</text>

    <text x="1152" y="16" text-anchor="end" fill="#9DA5B8" font-family="'Apple SD Gothic Neo', system-ui, -apple-system, sans-serif" font-size="12.5" font-weight="500">Created by <tspan fill="#F5F2EB" font-weight="700">정원석 (AI Mentor Jay)</tspan> · <tspan fill="#D4A359" font-weight="700">CONNECT AI LAB</tspan></text>
  </g>
</svg>
